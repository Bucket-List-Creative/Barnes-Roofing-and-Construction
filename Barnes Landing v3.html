  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

        e.target.tagName, String(e.target.src || e.target.href || ''));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');

    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht: 600;\n  font-display: swap;\n  src: url(\"79e2957c-29c0-4025-8a0a-2735a9e62c8f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n hed by the same crew, run by the same owner.<\u002Fp>\n        <div style=\"height:200px\"><img src=\"https://wordpress-1613377-6626776.cloudwaysapps.com/wp-content/uploads/2026/08/New-Builds.png\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px)\">\n  <section id=\"work\" data-screen-label=\"Recent work\" style=\"padding:72px 0 60px\">\n    <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin-bottom:12px\">Recent work<\u002Fspan>\n    <hr style=\"height:1px;border:0;background:var(--color-divider);margin:0 0 24px\">\n    <div class=\"blueprint\" style=\"position:relative;border:1px dashed var(--color-accent-400);background:var(--color-accent-100);padding:14px 20px;margin-bottom:32px;display:flex;align-items:center;gap:14px\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:22px;height:22px;flex:none\" fill=\"none\" stroke=\"var(--color-accent-700)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\"><\u002Frect><circle cx=\"9\" cy=\"10\" r=\"2\"><\u002Fcircle><path d=\"M3 17l5-5 4 4 3-3 6 6\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-size:14px;line-height:20px;color:var(--color-accent-800)\"><strong style=\"letter-spacing:0.08em;text-transform:uppercase;font-size:12px;display:block;margin-bottom:2px\">Project photos coming soon<\u002Fstrong>We're out on roofs, not behind cameras — recent project media is being gathered and will be posted here shortly.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"area\" data-screen-label=\"Service area\" style=\"display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px clamp(24px,5vw,96px);align-items:center;padding:48px 0 72px\">\n    <div>\n      <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin-bottom:12px\">Service area<\u002Fspan>\n      <hr style=\"height:1px;border:0;background:var(--color-divider);margin:0 0 12px\">\n      <h2 style=\"font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:32px;line-height:36px;text-transform:uppercase;margin:0\">St. Louis metro, both sides of the river<\u002Fh2>\n      <p style=\"font-size:15px;line-height:24px;margin:16px 0 0;max-width:48ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">From the shop in Cottleville we cover St. Charles, St. Louis City and County, Jefferson, Franklin, Warren and Lincoln — plus Madison, St. Clair and Monroe on the Illinois side. Outside the lines? Call anyway — for the right job we'll drive.<\u002Fp>\n      <a href=\"tel:+13142037003\" class=\"btn btn-ghost\" style=\"text-decoration:none;margin-top:24px;display:inline-flex\">Ask if we cover your address<\u002Fa>\n    <\u002Fdiv>\n    <figure class=\"blueprint\" data-reveal=\"\" style=\"margin:0;position:relative;border:1px solid var(--color-divider);padding:24px\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <iframe srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;utf-8&quot;&gt;\n&lt;script src=&quot;https://unpkg.com/d3@7.9.0/dist/d3.min.js&quot; integrity=&quot;sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;script src=&quot;https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js&quot; integrity=&quot;sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;\n&lt;style&gt;\n:root{--accent:#1d3fc0;--accent-300:#a6b7f0;--accent-400:#7089e2;--accent-700:#142a86;--accent-100:#e9edfb}\nhtml,body{margin:0;background:transparent;font-family:Barlow,system-ui,sans-serif}\npath.county{cursor:pointer;transition:fill .25s ease}\npath.county:hover{fill:var(--accent-100)}\ntext.lbl{pointer-events:none}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;map&quot; style=&quot;position:relative&quot;&gt;\n&lt;button id=&quot;zoom-out&quot; type=&quot;button&quot; aria-label=&quot;Zoom out to full map&quot; style=&quot;position:absolute;top:10px;right:10px;display:none;align-items:center;gap:8px;background:var(--accent);color:#fff;border:1px solid var(--accent-700);padding:8px 14px;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:0.12em;cursor:pointer&quot;&gt;\n&lt;svg sc-camel-view-box=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot; style=&quot;width:14px;height:14px&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;7&quot;&gt;&lt;/circle&gt;&lt;line x1=&quot;16.5&quot; y1=&quot;16.5&quot; x2=&quot;21&quot; y2=&quot;21&quot;&gt;&lt;/line&gt;&lt;line x1=&quot;8&quot; y1=&quot;11&quot; x2=&quot;14&quot; y2=&quot;11&quot;&gt;&lt;/line&gt;&lt;/svg&gt;\nZOOM OUT&lt;/button&gt;\n&lt;/div&gt;\n&lt;script&gt;\nconst FIPS = {\n  '29510':'St. Louis City','29189':'St. Louis Co.','29183':'St. Charles','29099':'Jefferson',\n  '29071':'Franklin','29219':'Warren','29113':'Lincoln',\n  '17119':'Madison','17163':'St. Clair','17133':'Monroe'\n};\nfetch('https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json').then(r=&gt;r.json()).then(topo=&gt;{\n  const all = topojson.feature(topo, topo.objects.counties);\n  const feats = all.features.filter(f=&gt;FIPS[f.id]);\n  const fc = {type:'FeatureCollection', features:feats};\n  const W=640,H=560;\n  const proj = d3.geoMercator().fitExtent([[14,14],[W-14,H-14]], fc);\n  const path = d3.geoPath(proj);\n  const svg = d3.select('#map').insert('svg',':first-child')\n    .attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%').style('display','block').style('max-height','96vh').style('margin','0 auto');\n  const g = svg.append('g');\n  let zoomed = null;\n  const counties = g.selectAll('path').data(feats).join('path')\n    .attr('class','county')\n    .attr('d',path)\n    .attr('fill', f=&gt;f.id==='29183' ? 'var(--accent-100)' : 'transparent')\n    .attr('stroke','var(--accent-700)').attr('stroke-width',1.25).attr('stroke-linejoin','round')\n    .on('click', (ev,f)=&gt;{\n      if (zoomed === f.id) { reset(); return; }\n      zoomed = f.id;\n      const [[x0,y0],[x1,y1]] = path.bounds(f);\n      const k = Math.min(4, 0.75 / Math.max((x1-x0)/W, (y1-y0)/H));\n      const tx = W/2 - k*(x0+x1)/2, ty = H/2 - k*(y0+y1)/2;\n      g.transition().duration(650).ease(d3.easeCubicOut)\n        .attr('transform',`translate(${tx},${ty}) scale(${k})`);\n      g.selectAll('path.county').transition().duration(400)\n        .attr('fill', d=&gt;d.id===f.id ? 'var(--accent-100)' : 'transparent')\n        .attr('stroke-width', d=&gt;d.id===f.id ? 1.6/k : 1/k)\n        .attr('opacity', d=&gt;d.id===f.id ? 1 : 0.35);\n      g.selectAll('text.lbl').transition().duration(400)\n        .attr('opacity', d=&gt;d.id===f.id ? 1 : 0.15)\n        .attr('font-size', d=&gt;(d.id===f.id?14:11)/k);\n      badge.text(FIPS[f.id].toUpperCase() + ' — COVERED, OWNER ON SITE');\n      badgeG.attr('opacity',1);\n      document.getElementById('zoom-out').style.display='flex';\n    });\n  function reset(){\n    zoomed = null;\n    g.transition().duration(650).ease(d3.easeCubicOut).attr('transform','translate(0,0) scale(1)');\n    g.selectAll('path.county').transition().duration(400)\n      .attr('fill', d=&gt;d.id==='29183' ? 'var(--accent-100)' : 'transparent')\n      .attr('stroke-width',1.25).attr('opacity',1);\n    g.selectAll('text.lbl').transition().duration(400).attr('opacity',1)\n      .attr('font-size', d=&gt;d.id==='29510'?9:12);\n    badgeG.attr('opacity',0);\n    document.getElementById('zoom-out').style.display='none';\n  }\n  document.getElementById('zoom-out').addEventListener('click', reset);\n  svg.on('click', (ev)=&gt;{ if (ev.target.tagName==='svg') reset(); });\n  g.selectAll('text.lbl').data(feats).join('text')\n    .attr('class','lbl')\n    .attr('transform',f=&gt;{\n      const c = path.centroid(f);\n      if (f.id==='29183') { c[0]-=10; c[1]-=14; }   // St. Charles — clear of shop marker\n      if (f.id==='29189') c[1]+=10;                 // St. Louis Co. — down from city label\n      if (f.id==='29510') { c[0]+=16; c[1]-=4; }    // St. Louis City\n      return `translate(${c})`;\n    })\n    .attr('text-anchor','middle')\n    .attr('font-size',f=&gt;f.id==='29510'?9:12)\n    .attr('font-weight',600).attr('letter-spacing','0.08em')\n    .attr('fill','var(--accent-700)')\n    .text(f=&gt;FIPS[f.id].toUpperCase());\n  // shop marker — Cottleville, St. Charles County\n  const shop = proj([-90.654, 38.746]);\n  g.append('circle').attr('cx',shop[0]).attr('cy',shop[1]).attr('r',5).attr('fill','var(--accent)').style('pointer-events','none');\n  const pulse = g.append('circle').attr('cx',shop[0]).attr('cy',shop[1]).attr('fill','none').attr('stroke','var(--accent)').style('pointer-events','none');\n  (function loop(){ pulse.attr('r',6).attr('opacity',0.9).transition().duration(2200).ease(d3.easeCubicOut).attr('r',22).attr('opacity',0).on('end',loop); })();\n  g.append('text').attr('x',shop[0]).attr('y',shop[1]+30).attr('text-anchor','middle')\n    .attr('font-size',11).attr('font-weight',700).attr('letter-spacing','0.1em').attr('fill','var(--accent)')\n    .style('pointer-events','none')\n    .text('THE SHOP — COTTLEVILLE');\n  // badge shown when zoomed into a county\n  const badgeG = svg.append('g').attr('opacity',0);\n  badgeG.append('rect').attr('x',14).attr('y',H-44).attr('width',W-28).attr('height',30).attr('fill','var(--accent)');\n  const badge = badgeG.append('text').attr('x',W/2).attr('y',H-24).attr('text-anchor','middle')\n    .attr('font-size',12).attr('font-weight',700).attr('letter-spacing','0.12em').attr('fill','#fff').text('');\n  badgeG.append('text').attr('x',W/2).attr('y',H-50).attr('text-anchor','middle')\n    .attr('font-size',9).attr('letter-spacing','0.1em').attr('fill','var(--accent-700)').text('CLICK AGAIN OR OUTSIDE TO ZOOM OUT');\n});\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\" title=\"Service area map — St. Louis metro counties, shop in Cottleville\" style=\"display:block;width:100%;aspect-ratio:8/7;border:0\"><\u002Fiframe>\n      <figcaption style=\"margin-top:12px;font-size:13px;line-height:20px;color:color-mix(in srgb, var(--color-text) 70%, transparent)\">Fig. 04 — St. Louis metro counties we cover; shop in Cottleville<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section id=\"estimate\" data-screen-label=\"Free estimate\" style=\"padding:24px 0 84px\">\n    <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin-bottom:12px\">Free estimate<\u002Fspan>\n    <hr style=\"height:1px;border:0;background:var(--color-divider);margin:0 0 32px\">\n    <div class=\"respond-grid\" style=\"display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px clamp(24px,5vw,96px);align-items:start\">\n      <div>\n        <h2 style=\"font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:32px;line-height:36px;text-transform:uppercase;margin:0\">Talk to the owner, not a queue<\u002Fh2>\n        <p style=\"font-size:15px;line-height:24px;margin:16px 0 0;max-width:44ch;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Send the form and Mr. Barnes calls you back within one business day with questions, straight answers, and a written number. Prefer to skip the form?<\u002Fp>\n        <a href=\"tel:+13142037003\" class=\"btn btn-ghost\" style=\"text-decoration:none;margin-top:24px;display:inline-flex\">Call (314) 203-7003<\u002Fa>\n      <\u002Fdiv>\n      <form class=\"blueprint respond-form\" data-reveal=\"\" style=\"position:relative;border:1px solid var(--color-divider);padding:32px;display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div class=\"field\"><label for=\"q-name\">Name<\u002Flabel><input class=\"input\" id=\"q-name\" type=\"text\" placeholder=\"Your name\"><\u002Fdiv>\n        <div class=\"field\"><label for=\"q-phone\">Phone<\u002Flabel><input class=\"input\" id=\"q-phone\" type=\"tel\" placeholder=\"(555) 000-0000\"><\u002Fdiv>\n        <div class=\"field\" style=\"grid-column:1 / -1\"><label for=\"q-address\">Job address<\u002Flabel><input class=\"input\" id=\"q-address\" type=\"text\" placeholder=\"Street, town\"><\u002Fdiv>\n        <div class=\"field\"><label for=\"q-service\">Service<\u002Flabel><sc-raw-select class=\"input\" id=\"q-service\"><option>Roof replacement<\u002Foption><option>Roof repair<\u002Foption><option>Gutters<\u002Foption><option>Siding<\u002Foption><option>New build<\u002Foption><option>Not sure yet<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n        <div class=\"field\"><label for=\"q-when\">How soon<\u002Flabel><sc-raw-select class=\"input\" id=\"q-when\"><option>As soon as possible<\u002Foption><option>Within a month<\u002Foption><option>This season<\u002Foption><option>Just planning<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n        <div class=\"field\" style=\"grid-column:1 / -1\"><label for=\"q-notes\">What's going on with the roof?<\u002Flabel><textarea class=\"input\" id=\"q-notes\" rows=\"3\" placeholder=\"Leak over the kitchen, hail last spring, etc.\" style=\"r f=\"tel:+13142037003\" style=\"display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,0.35);padding:12px 16px\" style-hover=\"background:var(--color-accent-800);border:1px solid rgba(255,255,255,0.7)\">\n          <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:18px;height:18px;flex:none\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg>\n          <span style=\"display:flex;flex-direction:column;line-height:1.2\"><span style=\"font-size:16px;font-weight:700;font-feature-settings:'tnum' 1;white-space:nowrap\">(314) 203-7003<\u002Fspan><span style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-300)\">Mon–Sat · 7a–7p<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <address style=\"font-style:normal;display:flex;gap:12px;font-size:14px;line-height:21px;color:rgba(255,255,255,0.75)\">\n          <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:18px;height:18px;flex:none;margin-top:2px\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n          <span>5377 State Hwy N Suite 552,<br>Cottleville MO 63304<\u002Fspan>\n        <\u002Faddress>\n        <a href=\"#estimate\" class=\"blueprint\" style=\"position:relative;align-self:flex-start;text-decoration:none;background:#fff;color:var(--color-accent-800);padding:12px 20px;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700\" style-hover=\"background:var(--color-accent-100)\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          Get a free estimate\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 0 28px;font-size:12px;letter-spacing:0.06em;color:rgba(255,255,255,0.55)\">\n      <span>© 2026 Barnes Roofing &amp; Construction · Cottleville, Missouri<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:10px;font-feature-settings:'tnum' 1\">SHEET 05 / 05 · REV A<a href=\"#hero\" aria-label=\"Back to top\" style=\"display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid rgba(255,255,255,0.35);color:#fff;text-decoration:none;margin-left:6px\" style-hover=\"background:var(--color-accent-800)\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:14px;height:14px\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 15l-6-6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;stripScreens&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3,&quot;min&quot;:1.5,&quot;max&quot;:5,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scroll effects&quot;,&quot;description&quot;:&quot;How much vertical scroll the pinned services strip consumes (in screens)&quot;},&quot;reveals&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Scroll effects&quot;,&quot;description&quot;:&quot;Fade-and-rise reveal on plates and figures&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const outer = document.getElementById('hstrip');\n    if (outer) outer.style.height = ((this.props.stripScreens ?? 3) * 100) + 'vh';\n    this.buildRuler = () => {\n      const g = document.getElementById('edge-nums');\n      if (!g) return;\n      while (g.firstChild) g.removeChild(g.firstChild);\n      for (let y = 0; y <= window.innerHeight; y += 60) {\n        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');\n        t.setAttribute('x', '20'); t.setAttribute('y', y + 9.5);\n        g.appendChild(t);\n      }\n    };\n    this.buildRuler();\n    this.updateRuler = () => {\n      const svg = document.getElementById('edge-ruler'), g = document.getElementById('edge-nums');\n      if (!svg || !g) return;\n      const hero = document.getElementById('hero');\n      const heroBottom = hero ? hero.getBoundingClientRect().bottom : 0;\n      svg.style.opacity = heroBottom > 0 ? '0' : '1';\n      // ticks scroll with the page: shift the tick group by scroll phase, number = feet from page top\n      const ticks = document.getElementById('edge-ticks');\n      if (ticks) {\n        ticks.setAttribute('transform', 'translate(0,' + (-(window.scrollY % 60)) + ')');\n        ticks.querySelectorAll('rect').forEach(r => r.setAttribute('height', window.innerHeight + 120));\n      }\n      const base = Math.ceil(window.scrollY / 60);\n      let i = 0;\n      for (const t of g.children) {\n        const y = (base + i) * 60 - window.scrollY;\n        t.setAttribute('y', y + 9.5);\n        t.textContent = ((base + i) * 5) + (i === 0 ? ' FT' : '');\n        i++;\n      }\n    };\n    this.onScroll = () => {\n      this.updateRuler();\n      const tape = document.getElementById('nav-tape');\n      if (tape) {\n        const doc = document.documentElement;\n        const pct = Math.min(1, window.scrollY / Math.max(1, doc.scrollHeight - window.innerHeight));\n        tape.style.width = (pct * 100) + '%';\n      }\n      const panel = document.getElementById('rail-panel'), openBtn = document.getElementById('rail-open');\n      if (panel && openBtn) {\n        const heroEl = document.getElementById('hero');\n        const past = heroEl ? heroEl.getBoundingClientRect().bottom < window.innerHeight * 0.5 : window.scrollY > 400;\n        const show = past && !this.railClosed;\n        panel.style.opacity = show ? '1' : '0';\n        panel.style.transform = show ? 'translateX(0)' : 'translateX(24px)';\n        panel.style.pointerEvents = show ? 'auto' : 'none';\n        panel.querySelectorAll('a').forEach(a => { a.style.opacity = show ? '1' : '0'; a.style.transform = show ? 'translateX(0)' : 'translateX(16px)'; });\n        openBtn.style.display = (past && this.railClosed) ? 'flex' : 'none';\n        const ids = { hero: 'hero', hstrip: 'hstrip', work: 'work', area: 'area', estimate: 'estimate' };\n        let active = 'hero';\n        for (const key in ids) {\n          const el = document.getElementById(ids[key]);\n          if (el && el.getBoundingClientRect().top <= window.innerHeight * 0.45) active = key;\n        }\n        panel.querySelectorAll('a').forEach(a => {\n          const on = a.getAttribute('data-rail') === active;\n          a.style.background = on ? 'var(--color-accent-700)' : '';\n          a.querySelector('.rail-tick').style.width = on ? '22px' : '10px';\n        });\n      }\n      const logo = document.getElementById('nav-logo'), topnav = document.getElementById('topnav');\n      if (logo && topnav) {\n        const condensed = window.scrollY > 80;\n        logo.style.height = condensed ? '38px' : '52px';\n        topnav.querySelector('nav').style.padding = condensed\n          ? '8px max(clamp(20px,5vw,72px),calc((100% - 1200px) / 2 + clamp(20px,5vw,72px)))'\n          : '14px max(clamp(20px,5vw,72px),calc((100% - 1200px) / 2 + clamp(20px,5vw,72px)))';\n      }\n      const o = document.getElementById('hstrip'), track = document.getElementById('htrack'), bar = document.getElementById('hbar');\n      if (!o || !track) return;\n      const total = o.offsetHeight - window.innerHeight;\n      const p = Math.min(1, Math.max(0, -o.getBoundingClientRect().top / Math.max(1, total)));\n      const max = Math.max(0, track.scrollWidth - track.parentElement.clientWidth);\n      track.style.transform = 'translate3d(' + (-p * max) + 'px,0,0)';\n      if (bar) bar.style.width = (p * 100) + '%';\n    };\n    this.railClosed = false;\n    const closeBtn = document.getElementById('rail-close'), openBtn = document.getElementById('rail-open');\n    if (closeBtn) closeBtn.addEventListener('click', () => { this.railClosed = true; this.onScroll(); });\n    if (openBtn) openBtn.addEventListener('click', () => { this.railClosed = false; this.onScroll(); });\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', () => { this.buildRuler(); this.onScroll(); });\n    this.onScroll();\n    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if ((this.props.reveals ?? true) && !reduce) {\n      const els = document.querySelectorAll('[data-reveal]');\n      this.io = new IntersectionObserver(es => es.forEach(e => {\n        if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; this.io.unobserve(e.target); }\n      }), { threshold: 0.12 });\n      els.forEach(el => {\n        el.style.opacity = '0'; el.style.transform = 'translateY(24px)';\n        el.style.transition = 'opacity .7s ease, transform .7s ease';\n        this.io.observe(el);\n      });\n    }\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onScroll);\n    if (this.io) this.io.disconnect();\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
